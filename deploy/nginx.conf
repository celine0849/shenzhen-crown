# 《深圳丽兹行冲冠之旅》Nginx 反代 + HTTPS 模板
# 用法（Ubuntu/Debian）：
#   1) 把本文件放到 /etc/nginx/sites-available/crown，将 example.com 换成你的域名
#   2) ln -s /etc/nginx/sites-available/crown /etc/nginx/sites-enabled/
#   3) 申请证书：sudo certbot --nginx -d example.com
#   4) 测试并重载：sudo nginx -t && sudo systemctl reload nginx

# HTTP 80：放行证书校验，其余 301 跳 HTTPS
server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：反代到本地 Node 服务（默认 8080）
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;  # 分享图等上传需求时按需调大

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       "upgrade";
        proxy_read_timeout 60s;
    }
}
