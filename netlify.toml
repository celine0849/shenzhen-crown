# ============================================================
# 《深圳丽兹行冲冠之旅》Netlify 部署配置
# ============================================================
[build]
  # 发布目录：前端静态文件
  publish = "public"
  # 构建命令（纯静态前端无需构建，空即可）
  command = ""

# Functions 目录（Netlify Serverless API）
[functions]
  directory = "netlify/functions"

# 环境变量（也可在 Netlify 控制台 → Site settings → Environment variables 中配置）
# 注意：service_role key 仅存于 Netlify 服务端，不会暴露给前端
[build.environment]
  SUPABASE_URL = "https://ljwuacjoynpotwkbpqdfq.supabase.co"
  # service_role key 请在 Netlify 控制台单独设置（不要写在这里明文）
  # SUPABASE_SERVICE_ROLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6..."
  # 备用（若不用 service_role）：anon key
  # SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6..."

# 重写规则：统一走单个 api 函数，通过 ?action= 区分
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# SPA 兜底：所有未匹配路由返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 静态资源缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"
