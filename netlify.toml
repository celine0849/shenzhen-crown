# ============================================================
# 《深圳丽兹行冲冠之旅》Netlify 部署配置
# ============================================================
[build]
  # 发布目录：前端静态文件
  publish = "public"
  # 构建命令（纯静态前端无需构建，空即可）
  command = ""

# Functions 目录（Netlify Serverless API）
[functions]
  directory = "netlify/functions"

# 环境变量（也可在 Netlify 控制台 → Site settings → Environment variables 中配置）
# [build.environment]
#   SUPABASE_URL = "https://xxxxx.supabase.co"
#   SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6..."
#   ACTIVITY_START = "2026-08-01T08:00:00+08:00"
#   ACTIVITY_END = "2026-08-03T23:59:59+08:00"
#   DAILY_LIMIT = "10"

# 重写规则：让 /api/* 走 Netlify Functions
[[redirects]]
  from = "/api/chongguan/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/chongguan/scores"
  to = "/.netlify/functions/scores"
  status = 200

[[redirects]]
  from = "/api/chongguan/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/chongguan/players/today"
  to = "/.netlify/functions/players-today"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# SPA 兜底：所有未匹配路由返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 静态资源缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"
